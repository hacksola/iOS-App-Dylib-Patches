
name: Build LiveContainer iOS Patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Apple SDK
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install CMake
        run: brew install cmake

      - name: Configure project
        run: cmake -B build-cmake

      - name: Build project
        run: cmake --build build-cmake --parallel 2


      - name: Inspect and collect build outputs
        run: |
          echo "=== Build directory ==="
          ls -la build-cmake
          echo "=== Possible iOS libraries ==="
          find . -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.a" \) -print
          echo "=== Copy dylib files ==="
          mkdir -p artifacts
          find . -type f -name "*.dylib" \
            -not -path "./artifacts/*" \
            -exec cp {} artifacts/ \;
          echo "=== Collected files ==="
          ls -lah artifacts

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-iOS-Patches
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
